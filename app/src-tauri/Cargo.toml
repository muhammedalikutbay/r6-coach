[package]
name = "r6koc-app"
version = "0.7.0"
description = "R6 Coach"
authors = ["Kutbay"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "r6koc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
log = "0.4"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
r6k-core = { path = "../../crates/r6k-core" }
r6k-paths = { path = "../../crates/r6k-paths" }


rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1"
notify-debouncer-mini = "0.6"

# Arenyze online stats (v4): HTTPS via rustls with the `ring` provider (no aws-lc/cmake build),
# OS certificate store via rustls-platform-verifier. The user's API key lives in the
# Windows Credential Manager (`keyring`, windows-native backend).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
keyring = { version = "3", features = ["windows-native"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mp4 = "0.14"

[dev-dependencies]
tempfile = "3"
bytes = "1"

# Kill clips (v4): Windows Graphics Capture of the game window (no injection, hardware H.264 encoder),
# plus the few Win32 calls to find the game window. Nothing is downloaded at run time.
[target."cfg(windows)".dependencies]
windows-capture = "2"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }
